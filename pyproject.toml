[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphguard"
version = "0.1.0"
description = "Temporal graph learning for illicit transaction detection on the Elliptic dataset (research/demo)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
