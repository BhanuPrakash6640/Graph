name: GraphGuard CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-test:
    name: Python Lint & Synthetic Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU Torch & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1+cpu torchvision==0.20.1+cpu torchaudio==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric==2.6.1
          pip install -r requirements-ml.txt
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-cov shap
          pip install -e .

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Pytest (Synthetic Fixtures & Backend API)
        run: |
          python -m pytest tests/ backend/tests/ -v --ignore=tests/test_data_real.py

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Check No Hardcoded Numbers
        working-directory: frontend
        run: |
          npm run check:numbers

      - name: Lint Next.js
        working-directory: frontend
        run: |
          npm run lint

      - name: Build Next.js
        working-directory: frontend
        run: |
          npm run build

